{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - Dynamic Labz</title>
<meta name="description" content="Dynamic Labz agency utility: prospects, leads, clients, projects, attendance and targets in one portal.">
<meta name="theme-color" content="#761fe3">
<link rel="icon" type="image/svg+xml" href="{% static 'img/logo-mark.svg' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
