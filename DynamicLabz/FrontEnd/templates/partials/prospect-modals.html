<!-- Log call -->
<div class="modal fade" id="callModal" tabindex="-1" aria-labelledby="callModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" id="callForm" novalidate>
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="callModalTitle">Log a call</h5>
          <div class="text-muted small" id="cm-prospect-name"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="cm-error" class="alert-dl" role="alert"></div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="cm-outcome">What happened?</label>
            <select class="form-select" id="cm-outcome" required></select>
          </div>
          <div class="col-sm-7">
            <label class="form-label" for="cm-called-at">Call time</label>
            <input type="datetime-local" class="form-control" id="cm-called-at">
          </div>
          <div class="col-sm-5">
            <label class="form-label" for="cm-duration">Duration (min)</label>
            <input type="number" min="0" max="600" class="form-control" id="cm-duration" placeholder="Optional">
          </div>
          <div class="col-12">
            <label class="form-label" for="cm-summary">Call notes</label>
            <textarea class="form-control" id="cm-summary" placeholder="What was discussed? e.g. Brief given, call later after 17th, needs pricing..."></textarea>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="cm-fu-toggle">
              <label class="form-check-label fw-600" for="cm-fu-toggle">Schedule a follow-up</label>
            </div>
          </div>
          <div class="col-12 d-none" id="cm-fu-wrap">
            <div class="dl-card p-3" style="box-shadow:none;background:var(--dl-surface-2)">
              <div class="d-flex flex-wrap gap-2 mb-3" id="cm-fu-quick">
                <button type="button" class="btn btn-sm btn-ghost" data-days="1">Tomorrow</button>
                <button type="button" class="btn btn-sm btn-ghost" data-days="3">In 3 days</button>
                <button type="button" class="btn btn-sm btn-ghost" data-days="7">Next week</button>
                <button type="button" class="btn btn-sm btn-ghost" data-days="14">In 2 weeks</button>
              </div>
              <div class="row g-3">
                <div class="col-sm-7">
                  <label class="form-label" for="cm-fu-at">Follow up on</label>
                  <input type="datetime-local" class="form-control" id="cm-fu-at">
                </div>
                <div class="col-sm-5">
                  <label class="form-label" for="cm-fu-type">Type</label>
                  <select class="form-select" id="cm-fu-type">
                    <option value="call">Call</option><option value="meeting">Meeting</option>
                    <option value="email">Email</option><option value="whatsapp">WhatsApp</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="cm-fu-note">Reminder note</label>
                  <input type="text" class="form-control" id="cm-fu-note" maxlength="480" placeholder="e.g. Call on 17th about the demo">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="cm-save"><i class="bi bi-check2"></i>Save call</button>
      </div>
    </form>
  </div>
</div>

<!-- Add / edit prospect -->
<div class="modal fade" id="prospectModal" tabindex="-1" aria-labelledby="prospectModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
    <form class="modal-content" id="prospectForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="prospectModalTitle">Add prospect</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="pf-error" class="alert-dl" role="alert"></div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="pf-company">Company name *</label><input class="form-control" id="pf-company" name="company_name" required maxlength="255"></div>
          <div class="col-md-6"><label class="form-label" for="pf-place">Place</label><input class="form-control" id="pf-place" name="place" maxlength="150" placeholder="City / area"></div>
          <div class="col-md-6"><label class="form-label" for="pf-website">Website</label><input class="form-control" id="pf-website" name="website" maxlength="255" placeholder="example.com (optional)"></div>
          <div class="col-md-6"><label class="form-label" for="pf-industry">Industry</label><input class="form-control" id="pf-industry" name="industry" maxlength="150"></div>
          <div class="col-md-6"><label class="form-label" for="pf-person">Contact person *</label><input class="form-control" id="pf-person" name="contact_person" required maxlength="150"></div>
          <div class="col-md-6"><label class="form-label" for="pf-designation">Designation</label><input class="form-control" id="pf-designation" name="designation" maxlength="100"></div>
          <div class="col-md-6"><label class="form-label" for="pf-number">Contact number *</label><input class="form-control" id="pf-number" name="contact_number" required maxlength="20" inputmode="tel"></div>
          <div class="col-md-6"><label class="form-label" for="pf-alt">Alternate number</label><input class="form-control" id="pf-alt" name="alternate_number" maxlength="20" inputmode="tel"></div>
          <div class="col-md-6"><label class="form-label" for="pf-email">Email</label><input type="email" class="form-control" id="pf-email" name="email"></div>
          <div class="col-md-6">
            <label class="form-label" for="pf-source">Source</label>
            <select class="form-select" id="pf-source" name="source">
              <option value="cold_call">Cold call</option><option value="referral">Referral</option><option value="website">Website</option>
              <option value="linkedin">LinkedIn</option><option value="event">Event</option><option value="other">Other</option>
            </select>
          </div>
          {% if user.role == 'admin' %}
          <div class="col-md-6"><label class="form-label" for="pf-owner">Assigned to</label><select class="form-select" id="pf-owner" name="owner"></select></div>
          {% endif %}
          <div class="col-12"><label class="form-label" for="pf-requirement">What do they need? / other info</label><textarea class="form-control" id="pf-requirement" name="requirement" placeholder="Requirements, budget hints, who referred them..."></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="pf-save"><i class="bi bi-check2"></i>Save prospect</button>
      </div>
    </form>
  </div>
</div>

<!-- Add / reschedule follow-up -->
<div class="modal fade" id="followUpModal" tabindex="-1" aria-labelledby="followUpModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="followUpForm" novalidate>
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="followUpModalTitle">Add follow-up</h5>
          <div class="text-muted small" id="fm-prospect-name"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="fm-error" class="alert-dl" role="alert"></div>
        <div class="d-flex flex-wrap gap-2 mb-3" id="fm-quick">
          <button type="button" class="btn btn-sm btn-ghost" data-days="1">Tomorrow</button>
          <button type="button" class="btn btn-sm btn-ghost" data-days="3">In 3 days</button>
          <button type="button" class="btn btn-sm btn-ghost" data-days="7">Next week</button>
        </div>
        <div class="row g-3">
          <div class="col-sm-7"><label class="form-label" for="fm-at">Date and time *</label><input type="datetime-local" class="form-control" id="fm-at" required></div>
          <div class="col-sm-5">
            <label class="form-label" for="fm-type">Type</label>
            <select class="form-select" id="fm-type">
              <option value="call">Call</option><option value="meeting">Meeting</option>
              <option value="email">Email</option><option value="whatsapp">WhatsApp</option>
            </select>
          </div>
          <div class="col-12"><label class="form-label" for="fm-notes">Note</label><input class="form-control" id="fm-notes" maxlength="480" placeholder="What should you do?"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="fm-save"><i class="bi bi-check2"></i>Save follow-up</button>
      </div>
    </form>
  </div>
</div>
